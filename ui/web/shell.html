<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>数算挑战</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <meta name="theme-color" content="#091426">
  <meta name="description" content="用四张数字牌与基本运算凑出 24 的中文益智挑战。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="数算挑战">
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; }
    html, body, #canvas { margin:0; padding:0; border:0; width:100%; height:100%; }
    body { overflow:hidden; background:#091426; color:#f7f4e9; font-family:"Noto Sans SC",system-ui,sans-serif; }
    #canvas { display:block; outline:none; }
    #status { position:fixed; inset:0; z-index:4; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%,#173558 0%,#0b1b31 48%,#091426 100%); transition:opacity .35s ease; }
    #status.ready { opacity:0; pointer-events:none; }
    .loader-card { width:min(360px,calc(100vw - 44px)); text-align:center; }
    .mark { width:76px; height:76px; margin:0 auto 20px; border-radius:23px; display:grid; place-items:center; background:linear-gradient(135deg,#1fe0be,#18a7d8); color:#0d1830; font-size:29px; font-weight:900; box-shadow:0 18px 40px #0008; }
    h1 { margin:0; font-size:28px; letter-spacing:.08em; }
    p { margin:10px 0 18px; color:#b5cadc; font-size:15px; }
    .track { height:8px; overflow:hidden; border-radius:99px; background:#17304d; }
    .fill { width:12%; height:100%; border-radius:inherit; background:#1fe0be; transition:width .2s ease; }
    #retry { margin-top:18px; padding:9px 18px; border:1px solid #3d7796; border-radius:10px; background:#16334f; color:#eff8fd; font:inherit; cursor:pointer; display:none; }
    #error { min-height:20px; margin-top:12px; color:#ffb19b; font-size:14px; }
    @media (prefers-reduced-motion: reduce) { #status,.fill { transition:none; } }
  </style>
</head>
<body>
  <canvas id="canvas">当前浏览器不支持此游戏。</canvas>
  <noscript>请启用 JavaScript 后开始游戏。</noscript>
  <section id="status" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="mark">24</div>
      <h1>数算挑战</h1>
      <p id="message">正在准备数字牌…</p>
      <div class="track" aria-label="加载进度"><div id="fill" class="fill"></div></div>
      <div id="error"></div>
      <button id="retry" type="button">重试</button>
    </div>
  </section>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    const engine = new Engine(GODOT_CONFIG);
    const overlay = document.getElementById('status');
    const fill = document.getElementById('fill');
    const message = document.getElementById('message');
    const error = document.getElementById('error');
    const retry = document.getElementById('retry');
    retry.addEventListener('click', () => window.location.reload());
    const showFailure = (reason) => {
      console.error(reason);
      message.textContent = '加载遇到问题，请重试。';
      error.textContent = '若持续发生，请刷新页面后再试。';
      retry.style.display = 'inline-block';
    };
    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
    if (missing.length) {
      showFailure('Missing browser features: ' + missing.join(', '));
    } else {
      engine.startGame({
        onProgress: (current, total) => {
          if (Number.isFinite(total) && total > 0) {
            fill.style.width = `${Math.max(8, Math.min(100, current / total * 100))}%`;
            message.textContent = '正在加载题目与规则…';
          } else {
            fill.style.width = '58%';
            message.textContent = '正在准备计算空间…';
          }
        }
      }).then(() => {
        fill.style.width = '100%';
        message.textContent = '准备完成';
        window.setTimeout(() => { overlay.classList.add('ready'); overlay.remove(); }, 220);
      }, showFailure);
    }
  </script>
</body>
</html>
